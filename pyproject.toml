[project]
name = "copy-that"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adam Brent", email = "adam.brent@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "exifread>=3.0.0",
    "filelock>=3.18.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
tray = ["pystray>=0.19"]

[project.scripts]
copy-that = "copy_that.main:main"
copy-that-tray = "copy_that.tray:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
    "pyinstaller>=6.0",
]
