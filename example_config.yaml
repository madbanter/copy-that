# Example configuration for CopyThat
# Rename this file to config.yaml to use it as your default configuration.

# --- Core Paths ---
# The directory to scan for source files. (Optional; required for sync/watch commands)
source_directory: "~/Pictures/Source"

# The base directory where organized files will be copied.
destination_base: "~/Pictures/Organized"

# --- Organization Settings ---
# Organization mode:
#   - 'date': Groups files into subfolders based on a date.
#   - 'mirror': Preserves the relative folder structure from the source.
organization_mode: "date"

# Folder format for 'date' mode (strftime format).
# e.g., '%Y%m%d' -> 20230101
# e.g., '%Y/%m-%B/%d' -> 2023/01-January/01
folder_format: "%Y%m%d"

# Optional path template (e.g., '{year}/{make}/{filename}.{ext}').
# If provided, this value overrides both 'organization_mode' and 'folder_format'.
# The template is treated as the full destination path relative to 'destination_base'.
# You must include '{filename}' and '{ext}' tokens if you want to preserve the original filename.
# Supported tokens: year, month, day, hour, minute, second, ext, filename, make, model
path_template: null

# Source for file dates:
#   - 'creation': Uses file birth time (macOS) or modification time fallback.
#   - 'modification': Uses file modification time.
#   - 'filename': Extracts the date from the filename itself.
#   - 'exif': Uses EXIF 'DateTimeOriginal' (for images).
date_source: "creation"

# Date format pattern if 'date_source' is set to 'filename'.
# CopyThat compiles this format string into a regex and extracts the matching
# date from anywhere in the filename stem, so prefixes or suffixes such as
# 'DSC_', 'IMG_', or '_edited' are handled automatically.
# e.g., 'DSC_2015-12-26 15.13.52.jpg' matches '%Y-%m-%d %H.%M.%S'
filename_date_format: "%Y-%m-%d %H.%M.%S"

# --- Filtering ---
# List of file extensions to include (case-insensitive).
include_extensions:
  - .jpg
  - .jpeg
  - .cr3
  - .arw
  - .dng
  - .mp4
  - .xmp

# List of glob patterns to exclude (e.g., 'IMG_*', '*.tmp', 'RAW/**').
# Each pattern is matched against both the bare filename and the file's path
# relative to the source directory, so subdirectory patterns work as expected.
exclude_patterns: []

# List of regex patterns to exclude.
# Each pattern is matched against both the bare filename and the file's path
# relative to the source directory.
exclude_regex: []

# --- Conflict & Reliability ---
# What to do if a file already exists at the destination:
#   - 'skip': Leave the existing file alone.
#   - 'overwrite': Replace the existing file.
#   - 'rename': Copy with a numeric suffix (e.g., photo_1.jpg).
conflict_policy: "skip"

# Optional verification method after copying:
#   - 'none': No post-copy check.
#   - 'size': Verify file sizes match.
#   - 'md5' or 'sha1': Verify cryptographic checksums match.
verification_method: "none"

# Behavior if verification fails:
#   - 'retry': Attempt to copy the file again (respects max_retries).
#   - 'ignore': Log the error but keep the destination file.
#   - 'delete': Remove the destination file if verification fails.
verification_failure_behavior: "retry"

# --- Automation & Monitoring ---
# Debounce period in seconds for watch mode
watch_debounce: 5.0
# Enable/disable auto-mount drive detection
auto_mount_enabled: false
# List of paths to monitor for new mounts.
# All entries are watched simultaneously; a warning is logged for any path
# that does not exist at startup.
auto_mount_points: ["/Volumes", "/media"]
# Patterns to automatically sync (if left empty, all drives are prompted or synced based on interactive_prompt)
auto_mount_whitelist: []
# Prompt before syncing from an unknown drive in interactive mode
auto_mount_interactive_prompt: true

# --- Logging & Output ---
output_verbosity: "normal" # 'minimal', 'normal', 'verbose'
log_file: null
max_log_size: 10485760     # 10 MB
log_backup_count: 5

# --- Performance ---
pre_sync_space_check: true
max_workers: null
max_retries: 3
retry_base_delay: 1.0
retry_exponential_backoff: true
buffer_size: 1048576
